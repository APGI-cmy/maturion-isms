# Copilot coding agent environment setup steps.
# Legacy setup reference. GitHub's supported setup workflow is
# .github/workflows/copilot-setup-steps.yml.
#
# Setup prepares dependencies; it does not grant or revoke agent write authority.
# Execution follows the selected agent contract and exact approved issue scope.
# Read-only roles remain read-only. Human merge/activation and independent QA remain required.

steps:
  # Install Node.js dependencies for MCP server (agent-bootstrap) used during sessions.
  - name: Install agent-bootstrap MCP server dependencies
    run: |
      cd mcp-servers/agent-bootstrap
      npm ci
