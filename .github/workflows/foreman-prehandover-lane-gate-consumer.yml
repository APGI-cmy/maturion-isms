name: Foreman Pre-Handover Lane-Gate Consumer

on:
  workflow_run:
    workflows: ["Foreman Pre-Handover Lane Gate"]
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: foreman-prehandover-lane-gate-${{ github.event.workflow_run.pull_requests[0].number }}-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  consume-failed-lane-gate:
    name: "governance/foreman-lane-gate-consumer"
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted default branch utilities
        uses: actions/checkout@v5
        with:
          ref: refs/heads/${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Resolve and validate source PR
        id: source
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const prs = Array.isArray(run.pull_requests) ? run.pull_requests : [];
            if (prs.length !== 1 || !Number.isInteger(prs[0]?.number)) {
              throw new Error('Failed lane-gate run is not bound to exactly one pull request.');
            }
            if (!/^[a-f0-9]{40}$/i.test(run.head_sha || '')) {
              throw new Error('Failed lane-gate run has a malformed head SHA.');
            }
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prs[0].number,
            });
            if (pr.state !== 'open') {
              core.setOutput('skip', 'true');
              return;
            }
            if (pr.head.sha !== run.head_sha) {
              throw new Error('Failed lane-gate run is stale: source head does not match the current PR head.');
            }
            core.setOutput('skip', 'false');
            core.setOutput('pr_number', String(pr.number));
            core.setOutput('head_sha', pr.head.sha);
            core.setOutput('source_run_id', String(run.id));
            core.setOutput('source_workflow', run.name || '');

      - name: Download source failure artifact
        if: steps.source.outputs.skip != 'true'
        uses: actions/download-artifact@v4
        with:
          name: cs2-trigger
          run-id: ${{ steps.source.outputs.source_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/foreman-lane-gate-artifact

      - name: Validate event and upsert bounded review task
        if: steps.source.outputs.skip != 'true'
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.source.outputs.pr_number }}
          HEAD_SHA: ${{ steps.source.outputs.head_sha }}
          SOURCE_RUN_ID: ${{ steps.source.outputs.source_run_id }}
          SOURCE_WORKFLOW: ${{ steps.source.outputs.source_workflow }}
          TRIGGER_PATH: ${{ runner.temp }}/foreman-lane-gate-artifact/.agent-admin/control/cs2-trigger.json
        with:
          script: |
            const fs = require('fs');
            const consumer = require('./.github/scripts/foreman-prehandover-lane-gate-consumer.js');
            const triggerPath = process.env.TRIGGER_PATH;
            if (!fs.existsSync(triggerPath)) {
              throw new Error('Failed lane-gate artifact does not contain the required trigger payload.');
            }
            let payload;
            try {
              payload = JSON.parse(fs.readFileSync(triggerPath, 'utf8'));
            } catch (error) {
              throw new Error(`Failed lane-gate artifact payload is malformed: ${error.message}`);
            }
            const trigger = consumer.validateTrigger(payload, {
              sourceRunId: process.env.SOURCE_RUN_ID,
              sourceWorkflow: process.env.SOURCE_WORKFLOW,
              prNumber: process.env.PR_NUMBER,
              headSha: process.env.HEAD_SHA,
            });
            const idempotencyKey = consumer.idempotencyKey(trigger);
            const body = consumer.renderReviewEvent(trigger);
            const prNumber = Number(process.env.PR_NUMBER);
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100,
            });
            const matching = comments
              .filter((comment) =>
                comment.user?.login === 'github-actions[bot]'
                && comment.body?.includes(consumer.MARKER)
                && comment.body.includes(`<!-- idempotency-key: ${idempotencyKey} -->`))
              .sort((left, right) => new Date(right.updated_at || right.created_at) - new Date(left.updated_at || left.created_at));
            if (matching[0]) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: matching[0].id,
                body,
              });
              core.info(`Updated bounded review event for idempotency key ${idempotencyKey}.`);
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
              core.info(`Created bounded review event for idempotency key ${idempotencyKey}.`);
            }
