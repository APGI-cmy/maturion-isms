name: PIT CS2 Controller Pilot

# The controller is deliberately limited to one PIT work item.  It persists the
# work register in the Work Request Issue, dispatches Foreman for its own
# pre-brief obligation, and binds a later implementation PR to that same row.
on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, reopened, synchronize]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch: {}

concurrency:
  group: pit-cs2-controller
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  control-one-work-item:
    name: cs2/pit-controller
    runs-on: ubuntu-latest
    steps:
      - name: Checkout controller from trusted main
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Claim, bind, or safely observe one work item
        uses: actions/github-script@v7
        env:
          EVENT_NAME: ${{ github.event_name }}
        with:
          script: |
            const controller = require('./.github/scripts/pit-cs2-controller.js');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const repository = `${owner}/${repo}`;
            const eventName = process.env.EVENT_NAME;

            async function comments(issueNumber) {
              const { data } = await github.rest.issues.listComments({
                owner, repo, issue_number: issueNumber, per_page: 100,
              });
              return data;
            }

            async function registerComment(issueNumber) {
              for (const comment of await comments(issueNumber)) {
                try {
                  const row = controller.parseRegister(comment.body || '');
                  if (row) return { comment, row };
                } catch (error) {
                  core.warning(`Ignoring malformed controller record on #${issueNumber}: ${error.message}`);
                }
              }
              return null;
            }

            async function writeRegister(issueNumber, existingComment, row) {
              const body = controller.renderRegister(row);
              if (existingComment) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existingComment.id, body });
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number: issueNumber, body });
              }
            }

            function isPitRequest(issue) {
              const body = issue.body || '';
              return /^\[CS2\]/.test(issue.title || '') && /##\s*Module\s*\n+\s*PIT\b/i.test(body);
            }

            async function activeRows(exceptIssueNumber) {
              const { data: issues } = await github.rest.issues.listForRepo({
                owner, repo, state: 'open', per_page: 100,
              });
              const rows = [];
              for (const issue of issues) {
                if (issue.pull_request || issue.number === exceptIssueNumber) continue;
                const found = await registerComment(issue.number);
                if (found && controller.isActive(found.row)) rows.push({ issue, ...found });
              }
              return rows;
            }

            async function dispatchForeman(issueNumber, row) {
              const marker = '<!-- pit-cs2-foreman-dispatch:v1 -->';
              const already = (await comments(issueNumber)).some((comment) =>
                (comment.body || '').includes(marker) && (comment.body || '').includes(row.work_item_id));
              if (already) return;
              const body = [
                marker,
                `## Foreman dispatch — ${row.work_item_id}`,
                '',
                '@copilot You are **foreman-v2-agent** for this one work item. Bootstrap yourself and load the applicable Tier 2/Tier 3 context.',
                '',
                '**Your immediate, Foreman-owned action is mandatory:** create the PR-scoped `wave-current-tasks.md`, invoke `independent-assurance-agent` with `action: PRE-BRIEF`, and obtain the canonical, job-bound IAA pre-brief before any builder delegation.',
                '',
                'Do not ask Johan/CS2 to authorise, waive, or create this pre-brief. Resolve ordinary governance, tooling, evidence-format, and configuration defects inside the declared sandbox. Escalate only a genuine external credential/cost/destructive action, protected-contract change, unresolvable business decision, or final human UI/UX acceptance.',
                '',
                `When an implementation PR is opened, include \`CS2-Work-Item: ${row.work_item_id}\` in its body.`,
              ].join('\n');
              await github.rest.issues.createComment({ owner, repo, issue_number: issueNumber, body });
            }

            if (eventName === 'issues') {
              const issue = context.payload.issue;
              if (!isPitRequest(issue)) {
                core.info('Not a PIT CS2 Work Request; no action.');
                return;
              }
              if (await registerComment(issue.number)) {
                core.info('Work register already exists; idempotent no-op.');
                return;
              }
              const active = await activeRows(issue.number);
              if (active.length) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: issue.number,
                  body: `<!-- pit-cs2-controller:single-job-conflict -->\nCS2_DECISION_REQUIRED: active PIT work item \`${active[0].row.work_item_id}\` is not closed. This request was not claimed.`,
                });
                return;
              }
              const row = controller.initialRegister({ issueNumber: issue.number, repository });
              await writeRegister(issue.number, null, row);
              await dispatchForeman(issue.number, row);
              return;
            }

            if (eventName === 'pull_request_target') {
              const pr = context.payload.pull_request;
              const match = (pr.body || '').match(/^CS2-Work-Item:\s*(pit-issue-\d+)\s*$/mi);
              if (!match) {
                core.info('PR has no CS2 work-item binding; no action.');
                return;
              }
              const issueNumber = Number(match[1].replace('pit-issue-', ''));
              const found = await registerComment(issueNumber);
              if (!found || !controller.isActive(found.row) || found.row.work_item_id !== match[1]) {
                core.warning('Work-item binding is absent, closed, or mismatched; no action.');
                return;
              }
              if (found.row.pr_number === pr.number && found.row.last_processed?.head_sha === pr.head.sha) {
                core.info('Nominated PR head was already processed; idempotent no-op.');
                return;
              }
              const next = controller.bindPullRequest(found.row, { prNumber: pr.number, headSha: pr.head.sha });
              await writeRegister(issueNumber, found.comment, next);
              await github.rest.issues.createComment({
                owner, repo, issue_number: pr.number,
                body: [
                  '<!-- pit-cs2-pr-bound:v1 -->',
                  `@copilot Foreman: PR #${pr.number} at \`${pr.head.sha}\` is bound to \`${next.work_item_id}\`.`,
                  'Complete the job-bound IAA PRE-BRIEF now. A missing pre-brief is a Foreman action, not a CS2 escalation. Ignore any historic wave, pre-brief, or gate material that is not bound to this work-item and PR.',
                ].join('\n'),
              });
              return;
            }

            if (eventName === 'issue_comment' && !context.payload.issue.pull_request) {
              const issue = context.payload.issue;
              const found = await registerComment(issue.number);
              if (!found) {
                core.info('No PIT work register on this Issue; no action.');
                return;
              }
              const author = String(context.payload.comment.user?.login || '');
              if (author !== 'APGI-cmy') {
                core.info('Approval commands are accepted only from human CS2.');
                return;
              }
              const command = String(context.payload.comment.body || '').trim()
                .match(/^\/cs2-(approve|reject)\s+(scope-expansion|merge)$/i);
              if (!command) {
                core.info('No controller approval command; no action.');
                return;
              }
              const status = command[1].toLowerCase() === 'approve' ? 'approved' : 'rejected';
              const kind = command[2].toLowerCase();
              const next = controller.recordHumanApproval(found.row, kind, author, status);
              await writeRegister(issue.number, found.comment, next);
              core.info(`Recorded human ${kind} decision: ${status}.`);
              return;
            }

            // Comments and hourly runs are intentionally observation-only until a
            // declared transition is implemented.  They never manufacture a new
            // wave, pre-brief, evidence bundle, or agent appointment.
            core.info('Safety observation complete: no changed, controller-owned transition to apply.');
