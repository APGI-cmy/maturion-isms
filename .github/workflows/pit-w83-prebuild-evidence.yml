name: PIT W8.3 Pre-Build Evidence

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/pit-w83-prebuild-evidence.yml'
      - '.agent-admin/**pit-w83**'
      - 'modules/pit/**'
      - 'apps/isms-portal/src/App.tsx'
      - 'apps/isms-portal/src/pages/pit/**'
      - 'supabase/migrations/**'
      - 'apps/isms-portal/package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '9.12.0'

jobs:
  qa-to-red-sentinel:
    name: W8.3 Intended RED Confirmed
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v5

      - name: Confirm runner Node version
        run: node --version

      - name: Run sentinel and preserve raw RED output
        id: sentinel
        shell: bash
        run: |
          set +e
          node --test modules/pit/06-qa-to-red/executable/pit-w83-prebuild.red.test.mjs 2>&1 | tee pit-w83-red-sentinel.log
          sentinel_status=${PIPESTATUS[0]}
          set -e

          echo "sentinel_status=${sentinel_status}" >> "$GITHUB_OUTPUT"

          if [ "$sentinel_status" -eq 0 ]; then
            echo "::error::W8.3 sentinel unexpectedly passed before implementation."
            exit 1
          fi

          required_failures=(
            "Missing milestone route"
            "Missing deliverable route"
            "Missing task route"
            "Missing project settings route"
            "Missing W8.3 hierarchy migration"
            "Missing structural-change request and approval migration"
            "Missing atomic project-leader approval RPC"
          )

          for expected in "${required_failures[@]}"; do
            if ! grep -Fq "$expected" pit-w83-red-sentinel.log; then
              echo "::error::Sentinel failed, but expected requirement failure was absent: $expected"
              exit 1
            fi
          done

          if grep -Eq "ENOENT|SyntaxError|ERR_MODULE_NOT_FOUND|ReferenceError" pit-w83-red-sentinel.log; then
            echo "::error::Sentinel contains a harness/runtime error rather than only intended missing-capability failures."
            exit 1
          fi

          {
            echo "## PIT W8.3 QA-to-RED"
            echo
            echo "- Command exit: ${sentinel_status} (expected non-zero)"
            echo "- Result: intended RED confirmed"
            echo "- Raw log: workflow artifact pit-w83-red-sentinel"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload RED sentinel log
        uses: actions/upload-artifact@v5
        with:
          name: pit-w83-red-sentinel
          path: pit-w83-red-sentinel.log
          retention-days: 30

  qa-to-red-contract:
    name: W8.3 Contract RED Confirmed (001–036)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v5

      - name: Confirm runner Node version
        run: node --version

      - name: Run 36-case contract inventory and preserve raw RED output
        id: contract
        shell: bash
        run: |
          set +e
          node --test modules/pit/06-qa-to-red/executable/pit-w83-red-contract.test.mjs 2>&1 | tee pit-w83-red-contract.log
          contract_status=${PIPESTATUS[0]}
          set -e

          echo "contract_status=${contract_status}" >> "$GITHUB_OUTPUT"

          if [ "$contract_status" -eq 0 ]; then
            echo "::error::W8.3 contract inventory unexpectedly passed before implementation."
            exit 1
          fi

          # Count tests and failures
          test_count=$(grep -c "^✖" pit-w83-red-contract.log || true)
          total_line=$(grep "^ℹ tests" pit-w83-red-contract.log || true)

          # Verify no harness errors
          if grep -Eq "ENOENT|SyntaxError|ERR_MODULE_NOT_FOUND|ReferenceError" pit-w83-red-contract.log; then
            echo "::error::Contract test contains a harness/runtime error rather than only intended missing-capability failures."
            exit 1
          fi

          # Verify all 36 IDs are present
          for i in $(seq -f "%03g" 1 36); do
            if ! grep -Fq "PIT-RED-W83-${i}" pit-w83-red-contract.log; then
              echo "::error::Contract test ID PIT-RED-W83-${i} not found in output."
              exit 1
            fi
          done

          # Verify all 36 fail (pass count must be 0)
          if grep -Eq "^ℹ pass [1-9]" pit-w83-red-contract.log; then
            echo "::error::One or more contract tests passed before W8.3 implementation — unexpected GREEN detected."
            exit 1
          fi

          {
            echo "## PIT W8.3 Contract RED (001–036)"
            echo
            echo "- Command exit: ${contract_status} (expected non-zero)"
            echo "- Tests: 36 / 36 RED — all 36 IDs present"
            echo "- Harness errors: none"
            echo "- Result: full contract inventory RED confirmed"
            echo "- Raw log: workflow artifact pit-w83-red-contract"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload contract RED log
        uses: actions/upload-artifact@v5
        with:
          name: pit-w83-red-contract
          path: pit-w83-red-contract.log
          retention-days: 30

  qa-to-red-supabase:
    name: W8.3 Supabase Integration RED Confirmed
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v5

      - name: Confirm runner Node version
        run: node --version

      - name: Run Supabase integration harness and preserve raw RED output
        id: supabase
        shell: bash
        run: |
          set +e
          node --test modules/pit/06-qa-to-red/executable/pit-w83-supabase.red.test.mjs 2>&1 | tee pit-w83-red-supabase.log
          supabase_status=${PIPESTATUS[0]}
          set -e

          echo "supabase_status=${supabase_status}" >> "$GITHUB_OUTPUT"

          if [ "$supabase_status" -eq 0 ]; then
            echo "::error::W8.3 Supabase integration harness unexpectedly passed before implementation."
            exit 1
          fi

          if grep -Eq "ENOENT|SyntaxError|ERR_MODULE_NOT_FOUND|ReferenceError" pit-w83-red-supabase.log; then
            echo "::error::Supabase harness contains a runtime error rather than only intended missing-capability failures."
            exit 1
          fi

          for id in 001 002 003 004 005 006 007 008 009 015 016 017 021 022 023 024 025 026 027 028 029 030 031 032 033 035 036; do
            if ! grep -Fq "PIT-RED-W83-${id}" pit-w83-red-supabase.log; then
              echo "::error::Supabase harness test ID PIT-RED-W83-${id} not found in output."
              exit 1
            fi
          done

          if grep -Eq "^ℹ pass [1-9]" pit-w83-red-supabase.log; then
            echo "::error::One or more Supabase harness tests passed before W8.3 implementation — unexpected GREEN detected."
            exit 1
          fi

          {
            echo "## PIT W8.3 Supabase Integration RED"
            echo
            echo "- Command exit: ${supabase_status} (expected non-zero)"
            echo "- Tests: 27 / 27 RED — RPC/RLS/transaction/audit/tenant-isolation harness IDs confirmed"
            echo "- Harness errors: none"
            echo "- Harness type: controlled Supabase mock (PG error codes 42883/42P01/42501/P0001)"
            echo "- Result: Supabase integration RED confirmed"
            echo "- Raw log: workflow artifact pit-w83-red-supabase"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Supabase RED log
        uses: actions/upload-artifact@v5
        with:
          name: pit-w83-red-supabase
          path: pit-w83-red-supabase.log
          retention-days: 30

  qa-to-red-browser:
    name: W8.3 Browser/Component RED Confirmed
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v5

      - name: Confirm runner Node version
        run: node --version

      - name: Run browser/component harness and preserve raw RED output
        id: browser
        shell: bash
        run: |
          set +e
          node --test modules/pit/06-qa-to-red/executable/pit-w83-browser.red.test.mjs 2>&1 | tee pit-w83-red-browser.log
          browser_status=${PIPESTATUS[0]}
          set -e

          echo "browser_status=${browser_status}" >> "$GITHUB_OUTPUT"

          if [ "$browser_status" -eq 0 ]; then
            echo "::error::W8.3 browser/component harness unexpectedly passed before implementation."
            exit 1
          fi

          if grep -Eq "ENOENT|SyntaxError|ERR_MODULE_NOT_FOUND|ReferenceError" pit-w83-red-browser.log; then
            echo "::error::Browser harness contains a runtime error rather than only intended missing-capability failures."
            exit 1
          fi

          for id in 010 011 012 013 014 018 019 020 030 034; do
            if ! grep -Fq "PIT-RED-W83-${id}" pit-w83-red-browser.log; then
              echo "::error::Browser harness test ID PIT-RED-W83-${id} not found in output."
              exit 1
            fi
          done

          if grep -Eq "^ℹ pass [1-9]" pit-w83-red-browser.log; then
            echo "::error::One or more browser harness tests passed before W8.3 implementation — unexpected GREEN detected."
            exit 1
          fi

          {
            echo "## PIT W8.3 Browser/Component RED"
            echo
            echo "- Command exit: ${browser_status} (expected non-zero)"
            echo "- Tests: 11 / 11 RED — wizard/modal/route/role-denied harness IDs confirmed"
            echo "- Harness errors: none"
            echo "- Harness type: component-existence + route-registration + rendered-behaviour documentation"
            echo "- Result: browser/component RED confirmed"
            echo "- Raw log: workflow artifact pit-w83-red-browser"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload browser RED log
        uses: actions/upload-artifact@v5
        with:
          name: pit-w83-red-browser
          path: pit-w83-red-browser.log
          retention-days: 30

  normal-regression:
    name: Existing PIT Host Regression GREEN
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Run existing Vitest regression suite
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter isms-portal test:run 2>&1 | tee pit-w83-vitest-regression.log

      - name: Verify route registry
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter isms-portal verify:routes 2>&1 | tee pit-w83-route-regression.log

      - name: Build PIT integrated shell
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter isms-portal build 2>&1 | tee pit-w83-build-regression.log

      - name: Record known lint configuration debt
        shell: bash
        run: |
          {
            echo "## Regression scope"
            echo
            echo "- Vitest suite: executed"
            echo "- Route registry verification: executed"
            echo "- Production build: executed"
            echo "- Lint: not used as readiness evidence because the repository currently has ESLint 9 without an eslint.config.* file; this is pre-existing configuration debt and not caused by PR #1972."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload GREEN regression logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: pit-w83-normal-regression
          path: |
            pit-w83-vitest-regression.log
            pit-w83-route-regression.log
            pit-w83-build-regression.log
          retention-days: 30
