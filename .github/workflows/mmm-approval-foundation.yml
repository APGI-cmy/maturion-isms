name: MMM Approval Foundation

on:
  pull_request:
    paths:
      - 'apps/mmm/src/lib/approval/**'
      - 'supabase/functions/mmm-domain-approval-action/**'
      - 'supabase/functions/mmm-framework-approval-action/**'
      - 'supabase/migrations/20260724*.sql'
      - 'supabase/config.toml'
      - 'modules/MMM/tests/B4-framework/approval-workflow-foundation-red.test.ts'
      - 'modules/MMM/tests/vitest.approval-workflow-foundation.config.ts'
      - '.github/workflows/mmm-approval-foundation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  approval-foundation-green:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run approval foundation contract
        run: pnpm vitest run --config modules/MMM/tests/vitest.approval-workflow-foundation.config.ts

      - name: Verify descriptor regression authority remains present
        run: |
          test -f modules/MMM/tests/B4-framework/domain-workflow-behavior.test.tsx
          test -f scripts/mmm-live-dashboard-diagnosis/verify-descriptor-closure.mjs
          test -f .github/workflows/mmm-descriptor-live-closure.yml
