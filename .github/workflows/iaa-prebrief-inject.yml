name: IAA Pre-Brief Injection

on:
  push:
    branches-ignore:
      - main
    paths:
      - '.agent-admin/prs/pr-*/wave-current-tasks.md'
      - '.agent-workspace/foreman*/personal/wave-current-tasks.md'
  issue_comment:
    types: [created]
  workflow_dispatch: {}

permissions:
  pull-requests: write
  issues: write
  contents: read

jobs:
  iaa-prebrief-inject:
    name: "iaa-prebrief/inject"
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'issue_comment' &&
       (github.event.comment.body == '/iaa-prebrief' ||
        startsWith(github.event.comment.body, '/iaa-prebrief '))) ||
      github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout branch state when safe
        if: github.event_name == 'push' || github.event_name == 'issue_comment' || github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Resolve context
        id: ctx
        uses: actions/github-script@v7
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          ISSUE_NUMBER: ${{ github.event.issue.number || '' }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const eventName = process.env.EVENT_NAME;
            let prNumber = process.env.PR_NUMBER || '';
            let ref = process.env.PR_HEAD_SHA || context.sha;
            let branch = '';
            let baseSha = '';
            let baseRef = '';
            let prTitle = '';
            let prBody = '';
            let mergeConflictChecked = 'no';
            let mergeableWithBase = 'no';
            let baseSynced = 'no';
            let updatedAt = '';

            const setPrOutputs = async (pr) => {
              prNumber = String(pr.number);
              ref = pr.head.sha;
              branch = pr.head.ref || branch;
              baseSha = pr.base.sha || '';
              baseRef = pr.base.ref || '';
              prTitle = pr.title || '';
              prBody = pr.body || '';
              updatedAt = pr.updated_at || '';
              const mergeableState = String(pr.mergeable_state || '').toLowerCase();
              if (typeof pr.mergeable === 'boolean') {
                mergeConflictChecked = 'yes';
                mergeableWithBase = pr.mergeable ? 'yes' : 'no';
              } else if (mergeableState) {
                if (['clean', 'has_hooks', 'unstable'].includes(mergeableState)) {
                  mergeConflictChecked = 'yes';
                  mergeableWithBase = 'yes';
                } else if (mergeableState === 'dirty') {
                  mergeConflictChecked = 'yes';
                  mergeableWithBase = 'no';
                }
              }
              try {
                const { data: comparison } = await github.rest.repos.compareCommitsWithBasehead({
                  owner,
                  repo,
                  basehead: `${pr.base.sha}...${pr.head.sha}`,
                });
                if (['ahead', 'identical'].includes(String(comparison.status || '').toLowerCase())) {
                  baseSynced = 'yes';
                }
              } catch (error) {
                core.info(`Unable to determine whether PR head contains base SHA: ${error.message}`);
              }
            };

            if (eventName === 'issue_comment') {
              const issueNumber = Number(process.env.ISSUE_NUMBER || 0);
              try {
                const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: issueNumber });
                await setPrOutputs(pr);
              } catch (_e) {}
            }

            if (eventName === 'push') {
              branch = context.ref.replace('refs/heads/', '');
              try {
                const { data: pulls } = await github.rest.pulls.list({ owner, repo, state: 'open', head: `${owner}:${branch}`, per_page: 1 });
                if (pulls.length) {
                  const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: pulls[0].number });
                  await setPrOutputs(pr);
                }
              } catch (_e) {}
            }

            if (eventName === 'workflow_dispatch' && prNumber) {
              try {
                const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: Number(prNumber) });
                await setPrOutputs(pr);
              } catch (_e) {}
            }

            core.setOutput('pr_number', prNumber);
            core.setOutput('ref', ref);
            core.setOutput('branch', branch || 'unknown');
            core.setOutput('base_sha', baseSha);
            core.setOutput('base_ref', baseRef);
            core.setOutput('title', prTitle);
            core.setOutput('body', prBody);
            core.setOutput('updated_at', updatedAt);
            core.setOutput('merge_conflict_checked', mergeConflictChecked);
            core.setOutput('mergeable_with_base', mergeableWithBase);
            core.setOutput('base_synced_or_conflicts_resolved', baseSynced);

      - name: Collect current-head injector inputs
        id: inputs
        if: steps.ctx.outputs.pr_number != ''
        uses: actions/github-script@v7
        env:
          CHECKPOINT_INPUT_DIR: ${{ runner.temp }}/iaa-prebrief-inject
          PR_NUMBER: ${{ steps.ctx.outputs.pr_number }}
          HEAD_SHA: ${{ steps.ctx.outputs.ref }}
          PR_BODY: ${{ steps.ctx.outputs.body }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const headSha = process.env.HEAD_SHA;
            const prNumber = parseInt(process.env.PR_NUMBER, 10);
            const prBody = process.env.PR_BODY || '';
            let issueNumber = '';

            const { data: checkRunsData } = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: headSha,
              per_page: 100,
            });

            const { data: statusData } = await github.rest.repos.getCombinedStatusForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: headSha,
            });

            const repoFiles = {};
            const comments = [];

            const fetchFile = async (targetPath) => {
              try {
                const { data } = await github.rest.repos.getContent({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  path: targetPath,
                  ref: headSha,
                });
                if (!Array.isArray(data) && data.type === 'file') {
                  repoFiles[targetPath] = Buffer.from(data.content, 'base64').toString('utf8');
                }
              } catch {}
            };

            const fetchDirectory = async (targetPath, includePattern) => {
              try {
                const { data } = await github.rest.repos.getContent({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  path: targetPath,
                  ref: headSha,
                });
                if (!Array.isArray(data)) return;
                for (const entry of data) {
                  if (entry.type !== 'file') continue;
                  if (includePattern && !includePattern.test(entry.path)) continue;
                  await fetchFile(entry.path);
                }
              } catch {}
            };

            let changedFiles = [];
            let page = 1;
            while (true) {
              const { data: files } = await github.rest.pulls.listFiles({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                per_page: 100,
                page,
              });
              changedFiles = changedFiles.concat(files.map((file) => file.filename));
              if (files.length < 100) break;
              page += 1;
            }

            page = 1;
            while (true) {
              const { data: pageComments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                per_page: 100,
                page,
              });
              comments.push(...pageComments);
              if (pageComments.length < 100) break;
              page += 1;
            }

            const scopePath = `.agent-admin/scope-declarations/pr-${prNumber}.md`;
            await fetchFile(scopePath);
            const scopeText = repoFiles[scopePath] || '';
            const match = scopeText.match(/^ISSUE:\s*#?(\d+)/m);
            if (match) issueNumber = match[1];

            await fetchFile(`.admin/prs/pr-${prNumber}.json`);
            await fetchFile('.admin/pr.json');
            await fetchFile(scopePath);
            await fetchFile(`.functional-delivery/pr-${prNumber}.md`);

            const activeStatePath = `.agent-admin/prs/pr-${prNumber}/active-state.json`;
            await fetchFile(activeStatePath);
            await fetchFile(`.agent-admin/prs/pr-${prNumber}/wave-current-tasks.md`);

            const bodyArtifactMatch = prBody.match(/Functional-Delivery-Artifact:\s*(\S+)/i);
            if (bodyArtifactMatch) {
              await fetchFile(bodyArtifactMatch[1]);
            }

            const activeStateText = repoFiles[activeStatePath] || '';
            let activeState = null;
            try {
              activeState = activeStateText ? JSON.parse(activeStateText) : null;
            } catch (error) {
              core.info(`Active-state JSON for PR #${prNumber} could not be parsed (${error.message}). Using legacy fallback discovery.`);
            }

            const resolverSelectedPaths = [
              activeState?.manifest_path,
              activeState?.scope_path,
              activeState?.iaa_artifact_path,
              activeState?.ecap_artifact_path,
              activeState?.wave_tasks_path,
            ].filter(Boolean);

            if (resolverSelectedPaths.length > 0) {
              for (const artifactPath of resolverSelectedPaths) {
                await fetchFile(artifactPath);
              }
            } else {
              await fetchDirectory('.agent-admin/assurance', /^\.agent-admin\/assurance\/(iaa-prebrief-|iaa-token-|iaa-wave-record-).+\.md$/);
              await fetchDirectory('.agent-admin/prehandover', /^\.agent-admin\/prehandover\/proof-.+\.md$/);
              await fetchDirectory('.agent-workspace/execution-ceremony-admin-agent/bundles', /^\.agent-workspace\/execution-ceremony-admin-agent\/bundles\/.+\.md$/);
              await fetchDirectory('.agent-workspace/foreman-v2/memory', /^\.agent-workspace\/foreman-v2\/memory\/PREHANDOVER-.+\.md$/);
            }

            fs.mkdirSync(process.env.CHECKPOINT_INPUT_DIR, { recursive: true });
            const writeJson = (name, value) => {
              const targetPath = path.join(process.env.CHECKPOINT_INPUT_DIR, `pr-${prNumber}-${name}.json`);
              fs.writeFileSync(targetPath, JSON.stringify(value));
              return targetPath;
            };
            const repoFilesPath = path.join(process.env.CHECKPOINT_INPUT_DIR, `pr-${prNumber}-repo-files.json`);
            fs.writeFileSync(repoFilesPath, JSON.stringify(repoFiles));

            core.setOutput('check_runs_path', writeJson('check-runs', checkRunsData.check_runs || []));
            core.setOutput('commit_statuses_path', writeJson('commit-statuses', statusData.statuses || []));
            core.setOutput('pr_comments_path', writeJson('comments', comments));
            core.setOutput('changed_files_path', writeJson('changed-files', changedFiles));
            core.setOutput('repo_files_path', repoFilesPath);
            core.setOutput('issue_number', issueNumber);

      - name: Evaluate current-head blocker snapshot
        id: checkpoint
        if: steps.ctx.outputs.pr_number != ''
        env:
          PR_NUMBER: ${{ steps.ctx.outputs.pr_number }}
          ISSUE_NUMBER: ${{ steps.inputs.outputs.issue_number }}
          PR_TITLE: ${{ steps.ctx.outputs.title }}
          PR_BODY: ${{ steps.ctx.outputs.body }}
          PR_UPDATED_AT: ${{ steps.ctx.outputs.updated_at }}
          PR_BRANCH: ${{ steps.ctx.outputs.branch }}
          BASE_BRANCH: ${{ steps.ctx.outputs.base_ref }}
          BASE_SHA: ${{ steps.ctx.outputs.base_sha }}
          HEAD_SHA: ${{ steps.ctx.outputs.ref }}
          CHECKPOINT_TRIGGER: /iaa-prebrief
          CHECKPOINT_INTAKE_ONLY: "true"
          CHECKPOINT_MARK_CURRENT_RUN_AS_INTAKE: "true"
          CHECKPOINT_CHECK_RUNS_PATH: ${{ steps.inputs.outputs.check_runs_path }}
          CHECKPOINT_COMMIT_STATUSES_PATH: ${{ steps.inputs.outputs.commit_statuses_path }}
          CHECKPOINT_CHANGED_FILES_PATH: ${{ steps.inputs.outputs.changed_files_path }}
          CHECKPOINT_PR_COMMENTS_PATH: ${{ steps.inputs.outputs.pr_comments_path }}
          CHECKPOINT_REPO_FILES_PATH: ${{ steps.inputs.outputs.repo_files_path }}
          CHECKPOINT_MERGE_CONFLICT_CHECKED: ${{ steps.ctx.outputs.merge_conflict_checked }}
          CHECKPOINT_MERGEABLE_WITH_BASE: ${{ steps.ctx.outputs.mergeable_with_base }}
          CHECKPOINT_BASE_SYNCED_OR_CONFLICTS_RESOLVED: ${{ steps.ctx.outputs.base_synced_or_conflicts_resolved }}
        run: |
          RESULT_FILE="${{ runner.temp }}/iaa-prebrief-checkpoint-result-${{ steps.ctx.outputs.pr_number }}.json"
          node .github/scripts/pre-handover-checkpoint.js > "$RESULT_FILE"
          echo "result_path=$RESULT_FILE" >> "$GITHUB_OUTPUT"

      - name: Inspect task and wave-record state
        id: inspect
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.ctx.outputs.pr_number }}
          REF: ${{ steps.ctx.outputs.ref }}
          CHECKPOINT_RESULT_PATH: ${{ steps.checkpoint.outputs.result_path }}
        with:
          script: |
            const { buildInjectionDecision, readSimpleField } = require('./.github/scripts/iaa-prebrief-inject.js');
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = process.env.PR_NUMBER || '';
            const ref = process.env.REF || context.sha;

            // A pre-brief belongs only to the PR-scoped job.  The former global
            // personal-path fallback let a historic wave contaminate unrelated
            // PRs, which turned a Foreman-owned action into a false CS2 stop.
            const taskPaths = prNumber
              ? [`.agent-admin/prs/pr-${prNumber}/wave-current-tasks.md`]
              : [];

            let tasksFound = false;
            let tasksSnippet = '';
            let taskContent = '';
            let taskPath = '';
            let wave = 'unknown';
            let workItemId = '';
            let taskHeadSha = '';
            for (const path of taskPaths) {
              try {
                const { data } = await github.rest.repos.getContent({ owner, repo, path, ref });
                if (Array.isArray(data) || data.type !== 'file') continue;
                const content = Buffer.from(data.content, 'base64').toString('utf8');
                tasksFound = true;
                taskPath = path;
                taskContent = content;
                tasksSnippet = content.slice(0, 1500).replace(/`/g, "'");
                const match = content.match(/(?:\*\*Wave\*\*|wave):\s*(?:Wave\s+)?([^\s\n]+)/i);
                if (match) wave = match[1];
                const workItemMatch = content.match(/(?:CS2-Work-Item|work_item_id):\s*(pit-issue-\d+)/i);
                if (workItemMatch) workItemId = workItemMatch[1];
                const headShaMatch = content.match(/(?:head_sha_at_open|Head SHA):\s*"?([0-9a-f]{40})"?/i);
                if (headShaMatch) taskHeadSha = headShaMatch[1];
                break;
              } catch (_e) {}
            }

            let prebriefExists = false;
            let prebriefPath = '';
            let matchedWaveRecordContent = '';
            try {
              const { data: dir } = await github.rest.repos.getContent({ owner, repo, path: '.agent-admin/assurance', ref });
              const files = Array.isArray(dir) ? dir.filter(f => f.type === 'file' && /^iaa-wave-record-.*\.md$/.test(f.name)) : [];
              for (const file of files) {
                const { data } = await github.rest.repos.getContent({ owner, repo, path: file.path, ref });
                const content = Buffer.from(data.content, 'base64').toString('utf8');
                const lower = content.toLowerCase();
                const canonical = lower.includes('## pre-brief') &&
                  content.includes('IAA_PREFLIGHT_BRIEF:') &&
                  lower.includes('schema_version:') &&
                  lower.includes('result: preflight_brief_complete') &&
                  !lower.includes('superseded');
                const prBound = prNumber ? new RegExp(`\\bpr:\\s*#?${prNumber}\\b`, 'i').test(content) : true;
                const workItemBound = workItemId ? content.includes(workItemId) : true;
                const headBound = taskHeadSha ? content.includes(taskHeadSha) : true;
                if (canonical && prBound && workItemBound && headBound) {
                  prebriefExists = true;
                  prebriefPath = file.path;
                  matchedWaveRecordContent = content;
                  break;
                }
                if (!matchedWaveRecordContent && prBound) {
                  matchedWaveRecordContent = content;
                }
              }
            } catch (_e) {}

            const activeStatePath = prNumber ? `.agent-admin/prs/pr-${prNumber}/active-state.json` : '';
            let activeState = null;
            if (activeStatePath) {
              try {
                const { data } = await github.rest.repos.getContent({ owner, repo, path: activeStatePath, ref });
                if (!Array.isArray(data) && data.type === 'file') {
                  activeState = JSON.parse(Buffer.from(data.content, 'base64').toString('utf8'));
                }
              } catch (_e) {}
            }

            let manifest = null;
            const manifestPath = activeState?.manifest_path || (prNumber ? `.admin/prs/pr-${prNumber}.json` : '');
            if (manifestPath) {
              try {
                const { data } = await github.rest.repos.getContent({ owner, repo, path: manifestPath, ref });
                if (!Array.isArray(data) && data.type === 'file') {
                  manifest = JSON.parse(Buffer.from(data.content, 'base64').toString('utf8'));
                }
              } catch (_e) {}
            }

            let iaaArtifactText = matchedWaveRecordContent;
            const resolverIaaArtifactPath = activeState?.iaa_artifact_path || readSimpleField(taskContent, 'iaa_prebrief_path');
            if (resolverIaaArtifactPath) {
              try {
                const { data } = await github.rest.repos.getContent({ owner, repo, path: resolverIaaArtifactPath, ref });
                if (!Array.isArray(data) && data.type === 'file') {
                  iaaArtifactText = Buffer.from(data.content, 'base64').toString('utf8');
                }
              } catch (_e) {}
            }

            let checkpointFields = null;
            const checkpointResultPath = process.env.CHECKPOINT_RESULT_PATH || '';
            if (checkpointResultPath) {
              try {
                const checkpointResult = JSON.parse(fs.readFileSync(checkpointResultPath, 'utf8'));
                checkpointFields = checkpointResult.fields || null;
              } catch (error) {
                core.info(`Unable to parse checkpoint result from ${checkpointResultPath}: ${error.message}`);
              }
            }

            const injectionDecision = buildInjectionDecision({
              taskText: taskContent,
              activeState,
              manifest,
              iaaArtifactText,
              checkpointFields,
            });

            core.setOutput('tasks_found', String(tasksFound));
            core.setOutput('tasks_snippet', tasksSnippet);
            core.setOutput('task_path', taskPath);
            core.setOutput('work_item_id', workItemId);
            core.setOutput('task_head_sha', taskHeadSha);
            core.setOutput('wave', wave);
            core.setOutput('prebrief_exists', String(prebriefExists));
            core.setOutput('prebrief_path', prebriefPath);
            core.setOutput('injection_outcome', injectionDecision.outcome);
            core.setOutput('terminal_state_reason', injectionDecision.reason);

      - name: Skip if canonical pre-brief exists or injection outcome is not REQUEST_PREBRIEF
        if: steps.inspect.outputs.prebrief_exists == 'true' || steps.inspect.outputs.injection_outcome != 'REQUEST_PREBRIEF'
        run: |
          if [ "${{ steps.inspect.outputs.prebrief_exists }}" = "true" ]; then
            echo "Canonical pre-brief exists at ${{ steps.inspect.outputs.prebrief_path }}"
          else
            echo "${{ steps.inspect.outputs.terminal_state_reason }}"
          fi

      - name: Post canonical pre-brief request
        if: steps.inspect.outputs.tasks_found == 'true' && steps.inspect.outputs.prebrief_exists != 'true' && steps.inspect.outputs.injection_outcome == 'REQUEST_PREBRIEF'
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.ctx.outputs.pr_number }}
          BRANCH: ${{ steps.ctx.outputs.branch }}
          REF: ${{ steps.ctx.outputs.ref }}
          WAVE: ${{ steps.inspect.outputs.wave }}
          TASKS_FOUND: ${{ steps.inspect.outputs.tasks_found }}
          TASKS_SNIPPET: ${{ steps.inspect.outputs.tasks_snippet }}
          TASK_PATH: ${{ steps.inspect.outputs.task_path }}
          WORK_ITEM_ID: ${{ steps.inspect.outputs.work_item_id }}
          TASK_HEAD_SHA: ${{ steps.inspect.outputs.task_head_sha }}
          ISSUE_NUMBER: ${{ github.event.issue.number || '' }}
        with:
          script: |
            const prNumber = process.env.PR_NUMBER || '';
            const issueNumber = process.env.ISSUE_NUMBER || '';
            const targetNumber = Number(prNumber || issueNumber || 0);
            const wave = process.env.WAVE || 'unknown';
            const branch = process.env.BRANCH || 'unknown';
            const taskSection = process.env.TASKS_FOUND === 'true'
              ? '\n' + (process.env.TASKS_SNIPPET || '') + '\n...\n'
              : '> wave-current-tasks.md was not found on this branch.';

            const body = [
              '## IAA Pre-Brief Invocation',
              '',
              'Action Required: generate the canonical Wave Pre-Brief.',
              'This is a Foreman-owned prerequisite. Do not request a CS2 waiver for it.',
              `Wave: ${wave}`,
              `Branch: ${branch}`,
              prNumber ? `PR: #${prNumber}` : 'PR: PENDING',
              '',
              'Required artifact location:',
              '',
              '```text',
              '.agent-admin/assurance/iaa-wave-record-{wave}-{date}.md',
              '```',
              '',
              'Required section and block:',
              '',
              '```text',
              '## PRE-BRIEF',
              'IAA_PREFLIGHT_BRIEF:',
              'schema_version: "1.0.0"',
              'result: PREFLIGHT_BRIEF_COMPLETE',
              '```',
              '',
              'Do not create standalone prebrief files. Use the schema and protocol at:',
              '',
              '- .agent-admin/control/schemas/iaa-preflight-brief.schema.json',
              '- .agent-admin/control/protocols/IAA_PREFLIGHT_BRIEF_PROTOCOL.md',
              '',
              'Current wave task list:',
              '',
              taskSection,
              '',
              `PR-scoped task record: ${process.env.TASK_PATH || `.agent-admin/prs/pr-${prNumber}/wave-current-tasks.md`}`,
              process.env.WORK_ITEM_ID ? `Work item: ${process.env.WORK_ITEM_ID}` : 'Work item: MUST MATCH active controller work item',
              `Submitted head: ${process.env.TASK_HEAD_SHA || process.env.REF || context.sha}`,
            ].join('\n');

            if (targetNumber) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: targetNumber, body });
            } else {
              await github.rest.repos.createCommitComment({ owner: context.repo.owner, repo: context.repo.repo, commit_sha: process.env.REF || context.sha, body });
            }
