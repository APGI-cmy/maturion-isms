name: Copilot Setup Steps

# Runs during the "Prepare Copilot" phase — BEFORE "Start MCP Servers".
# Adds a preflight self-test for the agent-bootstrap MCP server so that
# missing dist/ files (MODULE_NOT_FOUND) surface as a clear Node stack trace
# rather than the generic "MCP error -32000: Connection closed".
#
# Setup prepares dependencies; it does not grant or revoke agent write authority.
# Execution follows the selected agent contract and exact approved issue scope.
# Read-only roles remain read-only. Human merge/activation and independent QA remain required.

on:
  workflow_dispatch: {}

# Read-only setup token; Copilot receives a separate token for its operations.
# https://docs.github.com/en/copilot/how-tos/copilot-on-github/customize-copilot/customize-cloud-agent/customize-the-agent-environment
permissions:
  contents: read

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Agent-bootstrap MCP preflight self-test (Linux)
        shell: bash
        run: |
          set -euo pipefail
          echo "Node: $(node --version)"
          echo "PWD: $(pwd)"
          cd mcp-servers/agent-bootstrap
          echo "Running agent-bootstrap validation suite..."
          npm test
