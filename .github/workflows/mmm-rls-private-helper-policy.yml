name: MMM RLS Private Helper Policy

on:
  pull_request:
    paths:
      - 'supabase/migrations/20260724000001_mmm_rls_private_helper_policy_reconciliation.sql'
      - 'modules/MMM/tests/B1-schema/rls-private-helper-policy-reconciliation.test.ts'
      - 'modules/MMM/tests/vitest.rls-private-helper-policy.config.ts'
      - 'modules/MMM/11-build/B1-schema/issue-1959-production-verification.md'
      - '.github/workflows/mmm-rls-private-helper-policy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rls-private-helper-policy-green:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run RLS private helper policy contract
        run: pnpm vitest run --config modules/MMM/tests/vitest.rls-private-helper-policy.config.ts
