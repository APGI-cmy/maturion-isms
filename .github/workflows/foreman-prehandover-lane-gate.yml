name: Foreman Pre-Handover Lane Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  foreman-prehandover-lane-gate:
    name: "preflight/foreman-prehandover-lane-gate"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Run pre-handover lane gate
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          SOURCE_WORKFLOW_RUN_ID: ${{ github.run_id }}
          SOURCE_WORKFLOW_NAME: ${{ github.workflow }}
        run: node .github/scripts/foreman-prehandover-lane-gate.js

      - name: Upload CS2 trigger artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cs2-trigger
          path: .agent-admin/control/cs2-trigger.json
          if-no-files-found: ignore
