name: Deploy MCP endpoint to Render (staging)

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "mcp-servers/agent-bootstrap/**"
      - "src/**"
      - ".github/workflows/deploy-mcp-render-staging.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Validate required secrets
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID_STAGING }}
        run: |
          set -euo pipefail
          test -n "${RENDER_API_KEY}" || (echo "Missing secret: RENDER_API_KEY" && exit 1)
          test -n "${RENDER_SERVICE_ID}" || (echo "Missing secret: RENDER_SERVICE_ID_STAGING" && exit 1)

      - name: Trigger Render deploy (staging)
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID_STAGING }}
        run: |
          set -euo pipefail
          HTTP_CODE=$(curl -sS -o /tmp/render-deploy.json -w "%{http_code}" -X POST \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            -H "accept: application/json" \
            -H "authorization: Bearer ${RENDER_API_KEY}" \
            -H "content-type: application/json" \
            -d '{}')
          cat /tmp/render-deploy.json
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "Render deploy trigger failed with HTTP $HTTP_CODE"
            exit 1
          fi
          echo "Render deploy triggered (HTTP $HTTP_CODE)."
